<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Cute Teddy Bear Head Cursor -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#f43f5e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Left Ear -->
    <circle cx="8" cy="9" r="6" fill="#fbcfe8" stroke="#f43f5e" stroke-width="1.8"/>
    <circle cx="8" cy="9" r="3.2" fill="#fda4af"/>
    <!-- Right Ear -->
    <circle cx="28" cy="9" r="6" fill="#fbcfe8" stroke="#f43f5e" stroke-width="1.8"/>
    <circle cx="28" cy="9" r="3.2" fill="#fda4af"/>
    <!-- Bear Face Head -->
    <ellipse cx="18" cy="20" rx="14" ry="12.5" fill="#fdf2f8" stroke="#f43f5e" stroke-width="1.8"/>
    <!-- Snout Muzzle -->
    <ellipse cx="18" cy="22" rx="6.5" ry="5" fill="#ffffff" stroke="#f43f5e" stroke-width="1.2"/>
    <!-- Cute Nose -->
    <ellipse cx="18" cy="19.5" rx="2.5" ry="1.8" fill="#e11d48"/>
    <!-- Cute Mouth -->
    <path d="M16 23 Q18 25 20 23" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Left Eye with Shine -->
    <circle cx="12.5" cy="17.5" r="2.2" fill="#4c0519"/>
    <circle cx="11.8" cy="16.8" r="0.8" fill="#ffffff"/>
    <!-- Right Eye with Shine -->
    <circle cx="23.5" cy="17.5" r="2.2" fill="#4c0519"/>
    <circle cx="22.8" cy="16.8" r="0.8" fill="#ffffff"/>
    <!-- Pink Blushes -->
    <ellipse cx="8.5" cy="21.5" rx="2.8" ry="1.6" fill="#fb7185" opacity="0.6"/>
    <ellipse cx="27.5" cy="21.5" rx="2.8" ry="1.6" fill="#fb7185" opacity="0.6"/>
    <!-- Cute Pink Bow Tie on Ear -->
    <g transform="translate(6, 4) scale(0.65)">
      <polygon points="0,0 6,4 0,8" fill="#f43f5e"/>
      <polygon points="12,0 6,4 12,8" fill="#f43f5e"/>
      <circle cx="6" cy="4" r="2" fill="#ffe4e6"/>
    </g>
  </g>
  <!-- Tiny pointer indicator star at top-left tip -->
  <polygon points="2,0 3,2 5,2 3.5,3.5 4,5.5 2,4 0,5.5 0.5,3.5 -1,2 1,2" fill="#fb7185" transform="translate(2, 2) scale(0.7)"/>
</svg>